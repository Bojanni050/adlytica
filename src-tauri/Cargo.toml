[package]
name = "adlytica"
version = "0.1.0"
description = "Adlytica — SEO & Ads Command Center"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tauri-plugin-notification = "2"
scraper = "0.20"
url = "2"
# DCR + PKCE-login (src/oauth.rs): state/verifier, S256-challenge en de query-encoding
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"

[lib]
name = "adlytica_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
